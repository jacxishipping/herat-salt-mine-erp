services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: herat_salt_erp
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  erp-web:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://erp_admin:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/herat_salt_erp
      JWT_SECRET: ${JWT_SECRET:-replace-with-64-char-random-secret}
      MOMP_ROYALTY_RATE_AFN: 350

volumes:
  pgdata:
